{% extends 'accounts/base.html' %}

{% block title %}Έντυπα{% endblock %}

{% block content %}
<style>.content-wrapper { border: none !important; }</style>

<div class="page-header">
    <h1><i class="fas fa-file-alt"></i> Έντυπα</h1>
</div>

<div class="dashboard-actions">
    <a href="{% url 'documents:dop_list' %}" class="doc-card">
        <div class="doc-card-icon">
            <i class="fas fa-certificate"></i>
        </div>
        <div class="doc-card-content">
            <h3>Δήλωση Απόδοσης</h3>
            <p>Δημιουργία και διαχείριση δηλώσεων απόδοσης (DoP)</p>
        </div>
        <div class="doc-card-arrow">
            <i class="fas fa-arrow-right"></i>
        </div>
    </a>
    <a href="{% url 'documents:en1279_list' %}" class="doc-card">
        <div class="doc-card-icon doc-card-icon-en">
            <i class="fas fa-table"></i>
        </div>
        <div class="doc-card-content">
            <h3>EN 1279-5</h3>
            <p>Έντυπο απόδοσης μονωτικών υαλοπινάκων κατά EN 1279-5</p>
        </div>
        <div class="doc-card-arrow">
            <i class="fas fa-arrow-right"></i>
        </div>
    </a>
</div>

<style>
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}
.page-header h1 {
    margin: 0;
    font-size: 1.35rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    color: var(--text-primary);
}
.dashboard-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
}
.doc-card {
    flex: 0 1 360px;
    display: flex;
    align-items: center;
    gap: 1rem;
    text-decoration: none;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: .75rem;
    padding: 1.25rem 1.5rem;
    color: var(--text-primary);
    transition: transform .15s ease, box-shadow .15s ease;
}
.doc-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    color: var(--text-primary);
}
.doc-card-icon {
    width: 3rem;
    height: 3rem;
    border-radius: .625rem;
    background: #0ea5e9;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
}
.doc-card-icon-en {
    background: #00737a;
}
.doc-card-content {
    flex: 1;
    min-width: 0;
}
.doc-card-content h3 {
    margin: 0 0 .25rem;
    font-size: 1.05rem;
}
.doc-card-content p {
    margin: 0;
    color: var(--text-secondary);
    font-size: .8125rem;
}
.doc-card-arrow {
    color: var(--text-secondary);
}
</style>
{% endblock %}
