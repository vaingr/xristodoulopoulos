{% extends 'accounts/base.html' %}

{% block title %}Διαγραφή EN 1279-5{% endblock %}

{% block content %}
<style>.content-wrapper { border: none !important; }</style>

<div class="page-header">
    <h1><i class="fas fa-trash"></i> Διαγραφή Εντύπου EN 1279-5</h1>
</div>

<div class="confirm-card">
    <p>Είστε σίγουροι ότι θέλετε να διαγράψετε το έντυπο
        <strong>{{ doc.document_number }}</strong>
        ({{ doc.product_designation }});</p>
    <form method="post" class="confirm-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ναι, διαγραφή</button>
        <a href="{% url 'documents:en1279_list' %}" class="btn btn-secondary">Ακύρωση</a>
    </form>
</div>

<style>
.page-header h1 {
    margin: 0 0 1.5rem;
    font-size: 1.35rem;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: .5rem;
}
.confirm-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: .75rem;
    padding: 1.5rem;
    max-width: 560px;
    color: var(--text-primary);
}
.confirm-actions {
    display: flex;
    gap: .75rem;
    margin-top: 1.25rem;
}
.btn {
    padding: .65rem 1rem;
    border: none;
    border-radius: .5rem;
    font-size: .875rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
}
.btn-danger { background: #dc3545; color: #fff; }
.btn-secondary { background: var(--bg-secondary, #6c757d); color: var(--text-primary, #fff); }
</style>
{% endblock %}
